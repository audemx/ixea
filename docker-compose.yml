services:
  web:
    build: .
    container_name: ixea_web
    ports:
      - "8000:80"
    volumes:
      # Lo público: Se monta en el DocumentRoot de Apache
      - ./src/public:/var/www/html
      # Lo privado: Se monta un nivel arriba, inaccesible vía HTTP
      - ./src/app:/var/www/app
    depends_on:
      - db
    networks:
      - ixea_network

  # MariaDB 11.8
  db:
    image: mariadb:11.8
    restart: always
    container_name: ixea_db
    environment:
      MARIADB_DATABASE: ixea_db
      MARIADB_ROOT_PASSWORD: ixea_1234.
    ports:
      - "3306:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - ixea_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ixea_phpmyadmin
    platform: linux/amd64
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ixea_1234.
    depends_on:
      - db
    networks:
      - ixea_network

volumes:
  mariadb:

networks:
  ixea_network:
    driver: bridge
