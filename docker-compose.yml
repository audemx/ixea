services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      # Lo público: Se monta en el DocumentRoot de Apache
      - ./src/public:/var/www/html
      # Lo privado: Se monta un nivel arriba, inaccesible vía HTTP
      - ./src/app:/var/www/app
    depends_on:
      - db

  # MariaDB 11.8
  db:
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ixea_1234.
      MARIADB_DATABASE: ixea_db
      MARIADB_USER: ixea_db
      MARIADB_PASSWORD: ixea_1234.
    ports:
      - "3306:3306"
    volumes:
      - mariadb:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ixea_1234.
    depends_on:
      - db

volumes:
  mariadb:
